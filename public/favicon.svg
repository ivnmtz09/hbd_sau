<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Filtros de sombra suave Claymorphic -->
    <filter id="clay-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#050714" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.2" />
    </filter>
    <filter id="clay-inset" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="3" dy="3"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.4" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- Gradientes de plastilina suave (Clay) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="cake-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <linearGradient id="cake-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>

    <linearGradient id="frosting" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>

    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <linearGradient id="crown-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Base Clay Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="36" fill="url(#bg-grad)" filter="url(#clay-shadow)"/>

  <!-- Brillo interior superior de plastilina -->
  <path d="M 24 14 C 18 14 14 18 14 26 C 14 20 20 14 36 14 Z" fill="#ffffff" opacity="0.3"/>

  <!-- Pastel de cumpleaños Clay 3D -->
  <!-- Base del pastel -->
  <rect x="28" y="70" width="72" height="34" rx="14" fill="url(#cake-base)" filter="url(#clay-shadow)"/>
  
  <!-- Detalle glaseado inferior -->
  <path d="M 28 82 Q 37 88 46 82 Q 55 88 64 82 Q 73 88 82 82 Q 91 88 100 82 L 100 70 L 28 70 Z" fill="url(#frosting)" opacity="0.9"/>

  <!-- Piso superior del pastel -->
  <rect x="38" y="48" width="52" height="26" rx="10" fill="url(#cake-top)" filter="url(#clay-shadow)"/>
  <path d="M 38 56 Q 44 60 51 56 Q 58 60 64 56 Q 71 60 77 56 Q 84 60 90 56 L 90 48 L 38 48 Z" fill="url(#frosting)"/>

  <!-- Vela de cumpleaños -->
  <rect x="60" y="30" width="8" height="20" rx="3" fill="#38bdf8"/>
  <path d="M 60 35 L 68 33 M 60 41 L 68 39 M 60 47 L 68 45" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Llama de la vela Clay brillante -->
  <path d="M 64 16 C 68 22 71 25 64 30 C 57 25 60 22 64 16 Z" fill="url(#flame-grad)"/>

  <!-- Corona dorada Clay (Sau Queen) -->
  <path d="M 24 44 L 28 32 L 34 38 L 40 28 L 44 42 Z" fill="url(#crown-grad)" transform="rotate(-15 34 38)"/>
  <circle cx="21" cy="28" r="2.5" fill="#fde047"/>
  <circle cx="31" cy="22" r="2.5" fill="#fde047"/>
  <circle cx="41" cy="26" r="2.5" fill="#fde047"/>

  <!-- Destello mágico -->
  <path d="M 96 26 L 98 32 L 104 34 L 98 36 L 96 42 L 94 36 L 88 34 L 94 32 Z" fill="#fef08a" opacity="0.9"/>
  <circle cx="106" cy="50" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="22" cy="68" r="2" fill="#ffffff" opacity="0.8"/>
</svg>
